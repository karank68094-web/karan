<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        .container {
            background:red;
            width: 300px;
            padding: 20px;
            margin: auto;
            margin-top: 100px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px grey;
        }

        input {
            width: 90%;
            height: 40px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid grey;
            padding-left: 10px;


        }

        button {
                     width: 100px;
                     height: 40px;
                     background-color: blue;
                     color: white;
                     border: none;
                     border-radius: 5px;
                     cursor: pointer;
        }

                button:hover{
                                 background-color: darkblue;
                }
    </style>
</head>

<body>
    <div class="container">
        <h2>Create Account</h2>
        <input type="text" placeholder="Full Name">
        <input type="text" placeholder="Username">
        <input type="text" placeholder="Email">
        <input type="text" placeholder="Password">

        <button>Sign Up</button>
    </div>

</body>

</html>
